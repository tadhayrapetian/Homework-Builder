# Netlify configuration for Worksheet Studio
# The site is plain static files: nothing is built, everything is published as is.

[build]
  publish = "."
  command = ""

# ── Caching ──────────────────────────────────────────────────────────────
# HTML must never be served from cache, or a new upload stays invisible for
# hours. The browser revalidates on every visit and gets the new file at once.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons and any future static assets can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ── Friendly URLs ────────────────────────────────────────────────────────
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 301

[[redirects]]
  from = "/builder"
  to = "/app.html"
  status = 301

# Send the bare www host to the apex domain once a custom domain is attached.
# Netlify also does this automatically when you set the primary domain.
